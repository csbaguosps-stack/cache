<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto History Wipe</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="header-left">
        <img src="../icons/icon32.png" alt="Logo" class="popup-icon">
        <h1 class="popup-title">Auto History Wipe</h1>
      </div>
      <button type="button" id="quickClearIconBtn" class="icon-action-btn" title="Quick Clean History">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="trash-svg">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </button>
    </header>

    <!-- Info Status Box -->
    <section class="info-card">
      <div class="info-row">
        <span class="info-label">Enable Timed:</span>
        <span class="info-value" id="statusTimedText">Every 5 minutes</span>
      </div>
      <div class="info-row">
        <span class="info-label">Time Range:</span>
        <span class="info-value" id="statusRangeText">All Time</span>
      </div>
    </section>

    <!-- Action Buttons -->
    <div class="button-group">
      <button type="button" id="popupClearNowBtn" class="action-btn btn-danger">
        Clear Data Now
      </button>
      <button type="button" id="popupOpenSettingsBtn" class="action-btn btn-primary">
        Open Settings
      </button>
    </div>

    <!-- Countdown Timer Card -->
    <section class="timer-card">
      <div class="timer-left">
        <span class="clock-icon">🕒</span>
        <span class="timer-label">Next clear in</span>
      </div>
      <div class="countdown-badge" id="countdownBadge">
        <span id="countdownText">10:06</span>
      </div>
    </section>

    <!-- Version & Auto Reload Button Card -->
    <section class="reload-card" id="reloadCard">
      <div class="reload-left">
        <span class="version-badge" id="popupVersionBadge">v1.0.0</span>
        <span class="reload-text" id="reloadStatusText">Versi terbaru</span>
      </div>
      <button type="button" id="btnReloadExtension" class="btn-reload" title="Muat ulang ekstensi seketika (Auto Reload)">
        <svg class="reload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        <span>Reload</span>
      </button>
    </section>

    <!-- Utility Links -->
    <nav class="links-row">
      <button type="button" id="linkRate" class="text-link-btn">
        <span class="link-icon">★</span> Rate
      </button>
      <button type="button" id="linkShare" class="text-link-btn">
        <span class="link-icon">↗</span> Share
      </button>
      <button type="button" id="linkHelp" class="text-link-btn">
        <span class="link-icon">❓</span> Help
      </button>
    </nav>

    <!-- Extension Status Switch -->
    <section class="status-section">
      <div class="status-text-group">
        <div class="status-title">Extension Status</div>
        <div class="status-subtitle">Enable or disable the extension</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="extensionToggle" checked>
        <span class="slider round"></span>
      </label>
    </section>

    <!-- Copyright Footer -->
    <footer class="popup-footer">
      <p class="copyright-tag">
        Auto History Wipe &bull; &copy; <a href="mailto:cs.baguosps@gmail.com">cs.baguosps@gmail.com</a>
      </p>
    </footer>

    <!-- Mini Feedback Toast -->
    <div id="popupToast" class="popup-toast">Data cleared!</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
